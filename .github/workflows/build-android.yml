name: Build Nivora Android APK

on:
  push:
    branches:
      - master
      - "work/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    name: Validate Nivora source configuration
    runs-on: ubuntu-latest
    outputs:
      build_ready: ${{ steps.config.outputs.build_ready }}
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify Nivora branding and build configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<string name="AppName">Nivora</string>' TMessagesProj/src/main/res/values/strings.xml
          grep -q 'APP_PACKAGE=com.nivora.chat' gradle.properties
          test -f TMessagesProj/src/main/res/drawable/ic_nivora_launcher.xml
          ! grep -q 'TelegramPremium' TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          ! grep -q 'PREMIUM_GRACE' TMessagesProj/src/main/java/org/telegram/ui/SettingsActivity.java
          test ! -f TMessagesProj_AppStandalone/google-services.json
          test ! -f TMessagesProj/config/release.keystore

      - name: Check whether private build settings are available
        id: config
        shell: bash
        env:
          API_ID: ${{ secrets.NIVORA_API_ID }}
          API_HASH: ${{ secrets.NIVORA_API_HASH }}
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ "$API_ID" =~ ^[1-9][0-9]*$ ]] &&
             [[ "$API_HASH" =~ ^[0-9a-fA-F]{32}$ ]] &&
             [[ -n "$FIREBASE_JSON" ]]; then
            echo "build_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APK build skipped. Add NIVORA_API_ID, NIVORA_API_HASH and GOOGLE_SERVICES_JSON to repository Actions secrets."
          fi

  debug-apk:
    name: Build test APK
    needs: source-check
    if: needs.source-check.outputs.build_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Prepare private app configuration
        shell: bash
        env:
          API_ID: ${{ secrets.NIVORA_API_ID }}
          API_HASH: ${{ secrets.NIVORA_API_HASH }}
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPS_API_KEY: ${{ secrets.NIVORA_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_JSON" > TMessagesProj_AppStandalone/google-services.json
          python -m json.tool < TMessagesProj_AppStandalone/google-services.json > /dev/null
          package_name="$(python -c 'import json; print(json.load(open("TMessagesProj_AppStandalone/google-services.json"))["client"][0]["client_info"]["android_client_info"]["package_name"])')"
          test "$package_name" = "com.nivora.chat"
          echo "NIVORA_API_ID=$API_ID" >> "$GITHUB_ENV"
          echo "NIVORA_API_HASH=$API_HASH" >> "$GITHUB_ENV"
          echo "NIVORA_MAPS_API_KEY=$MAPS_API_KEY" >> "$GITHUB_ENV"

      - name: Build Nivora Debug APK
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace :TMessagesProj_AppStandalone:assembleAfatDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: nivora-debug-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
